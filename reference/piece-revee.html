<title>Pièce Rêvée</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: plateforme éditoriale — barre de navigation, vues en grilles de « planches » matière, conseiller en tiroir latéral (plein écran sur mobile) */
:root{
  --bg:#F4F4EF; --surface:#FFFFFF; --soft:#EAEBE4; --ink:#121412; --muted:#5F645C; --line:#DDDFD6;
  --accent:#2747D0; --accent-ink:#FFFFFF; --accent-soft:#E3E8FB; --good:#2B6B3A; --warn:#94600F;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Onest","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px; --r-s:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F110F;--surface:#171A17;--soft:#1E211D;--ink:#ECEEE8;--muted:#9BA096;--line:#2B2F2A;
  --accent:#93A6FF;--accent-ink:#0B0E1E;--accent-soft:#1D2442;--good:#7DC48C;--warn:#E2B566;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F110F;--surface:#171A17;--soft:#1E211D;--ink:#ECEEE8;--muted:#9BA096;--line:#2B2F2A;
  --accent:#93A6FF;--accent-ink:#0B0E1E;--accent-soft:#1D2442;--good:#7DC48C;--warn:#E2B566;color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55;padding-block:0 96px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;letter-spacing:-.02em;text-wrap:balance;margin:0;line-height:1.08}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12px}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1320px;margin:0 auto}

/* Barre */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:18px;height:62px}
.logo{font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.03em;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo i{width:22px;height:22px;border-radius:6px;background:conic-gradient(from 210deg,#C9B08A,#3E5B4C,#2747D0,#D8C9B6,#C9B08A);display:inline-block}
nav.main{display:flex;gap:4px;margin-left:12px;overflow-x:auto}
nav.main a{text-decoration:none;color:var(--muted);font-weight:500;padding:8px 12px;border-radius:999px;white-space:nowrap;font-size:14.5px}
nav.main a[aria-current="page"]{color:var(--ink);background:var(--soft)}
.topbar .sp{flex:1}
.mbcount{font-family:var(--f-mono);font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 7px;margin-left:4px}
@media (max-width:860px){nav.main{display:none}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.small{padding:6px 12px;font-size:13px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}

/* Barre mobile */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:none;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar .in{display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);text-decoration:none;background:none;border:0;padding:4px 0;cursor:pointer;font-weight:500}
.tabbar svg{width:22px;height:22px}
.tabbar [aria-current="page"]{color:var(--accent)}
@media (max-width:860px){.tabbar{display:block}}

/* Vues */
.view{padding-top:28px}
.vhead{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.vhead h2{font-size:clamp(30px,4.4vw,52px)}
.vhead p{margin:8px 0 0;color:var(--muted);max-width:60ch}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{flex:1 1 240px;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 16px}

/* Accueil */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:stretch;padding-top:8px}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-size:clamp(40px,6.6vw,88px);font-weight:800;letter-spacing:-.045em;line-height:.95}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.lead{font-size:18px;color:var(--muted);max-width:46ch;margin:18px 0 24px}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap}
.collage{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(4,104px);gap:8px}
@media (max-width:600px){.collage{grid-template-rows:repeat(4,72px)}}
.collage .c{border-radius:var(--r-s);overflow:hidden;position:relative;background:var(--soft)}
.collage .c img{width:100%;height:100%;object-fit:cover;display:block}
.collage .c span{position:absolute;left:8px;bottom:8px;font-size:11px;background:rgba(255,255,255,.88);color:#121412;padding:2px 8px;border-radius:999px;font-weight:600}
.pillars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:40px}
@media (max-width:1000px){.pillars{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.pillars{grid-template-columns:minmax(0,1fr)}}
.pillar{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:6px}
.pillar:hover{border-color:var(--ink)}
.pillar h3{font-size:20px}
.pillar p{margin:0;color:var(--muted);font-size:14px}
.pillar .n{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.section{margin-top:52px}
.section h2{font-size:clamp(24px,3vw,34px);margin-bottom:6px}

/* Cartes */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.cards.wide{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;color:var(--ink);transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-2px);border-color:var(--muted)}
.card .vis{aspect-ratio:4/3;background:var(--soft);position:relative;max-width:100%}
.card .vis img{width:100%;height:100%;object-fit:cover;display:block}
.card .body{padding:13px 15px 15px;display:flex;flex-direction:column;gap:4px;flex:1}
.card h3{font-size:18px}
.card p{margin:0;font-size:13.5px;color:var(--muted)}
.card .meta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);margin-top:auto;padding-top:6px}
.tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--soft);border-radius:999px;padding:2px 9px;color:var(--muted)}
.heart{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);border:0;display:grid;place-items:center;cursor:pointer;color:#121412}
.heart svg{width:17px;height:17px}
.heart[aria-pressed="true"]{background:#2747D0;color:#fff}
.split{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;height:100%;gap:2px}
.split img{width:100%;height:100%;object-fit:cover;display:block}
.split img:first-child{grid-row:1/3}

/* Modal */
dialog{border:0;padding:0;border-radius:var(--r);background:var(--surface);color:var(--ink);width:min(980px,calc(100% - 24px));max-height:calc(100% - 32px)}
dialog::backdrop{background:rgba(10,12,10,.55)}
.dlg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
@media (max-width:760px){.dlg{grid-template-columns:minmax(0,1fr)}}
.dlg .vis{background:var(--soft);min-height:280px}
.dlg .vis img{width:100%;height:100%;object-fit:cover;display:block;min-height:280px}
.dlg .txt{padding:24px 26px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.dlg h2{font-size:32px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.dlg .close{position:absolute;top:10px;right:10px;z-index:2}
.swrow{display:flex;gap:6px}
.swrow span{width:30px;height:30px;border-radius:50%;border:1px solid var(--line)}
.links{display:flex;gap:6px;flex-wrap:wrap}
ul.dots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.dots li{padding-left:16px;position:relative}
ul.dots li::before{content:"";position:absolute;left:2px;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.notice{font-size:12.5px;color:var(--muted);background:var(--soft);border-radius:var(--r-s);padding:8px 11px}

/* Projet */
.proj{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);gap:24px}
@media (max-width:960px){.proj{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.brief{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:7px}
.field>.eyebrow{display:block}
.drop{border:1.5px dashed var(--muted);border-radius:var(--r-s);background:var(--soft);padding:22px 16px;text-align:center;cursor:pointer;position:relative}
.drop.over{border-color:var(--accent)}
.drop img{display:block;width:100%;max-height:220px;object-fit:cover;border-radius:6px}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs figure{margin:0;position:relative;width:60px;height:60px}
.thumbs img{width:60px;height:60px;object-fit:cover;border-radius:6px}
.thumbs button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:12px;padding:0;cursor:pointer}
.add{width:60px;height:60px;border:1.5px dashed var(--muted);border-radius:6px;display:grid;place-items:center;color:var(--muted);position:relative;font-size:22px}
.add input{position:absolute;inset:0;opacity:0;cursor:pointer}
textarea,select,input[type=text]{width:100%;background:var(--soft);border:1px solid transparent;border-radius:var(--r-s);padding:10px 12px}
textarea:focus,select:focus,input[type=text]:focus{border-color:var(--accent);outline:none}
textarea{min-height:92px;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;user-select:none}
.seg input:checked+label{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg input:focus-visible+label{outline:2.5px solid var(--accent);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status{font-size:13.5px;padding:10px 12px;border-radius:var(--r-s);background:var(--soft)}
.status.err{color:var(--warn)}
.spinner{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.ptabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:16px -20px 0;padding:0 14px}
.ptabs button{border:0;background:none;padding:11px 10px 9px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.ptabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.ppane{padding-top:20px}
.stage{position:relative;border-radius:var(--r-s);overflow:hidden;background:var(--soft);max-width:100%}
.stage img{display:block;width:100%;height:auto}
.tint{position:absolute;inset:0;pointer-events:none;transition:opacity .4s}
.pin{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:2px solid #fff;font-family:var(--f-mono);font-size:12px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.35);padding:0}
.pin[aria-pressed="true"]{background:#fff;color:#121412}
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:14px}
.zone{border:1px solid var(--line);border-radius:var(--r-s);padding:11px 13px;background:var(--surface);cursor:pointer;text-align:left}
.zone.on{border-color:var(--accent)}
.zone b{font-family:var(--f-mono);color:var(--accent);margin-right:6px}
.zone p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.prod{border:1px solid var(--line);border-radius:var(--r-s);padding:14px;display:flex;flex-direction:column;gap:7px;background:var(--surface)}
.prod .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.prod .bn{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.prod h4{font-size:17px}
.prod .price{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
.prod p{margin:0;font-size:13.5px;color:var(--muted)}
.prod .links{margin-top:auto}
.conf{font-size:11.5px;color:var(--warn)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.sw{border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden}
.sw .c{height:76px}
.sw .t{padding:8px 10px;font-size:13px}
.tuto{border:1px solid var(--line);border-radius:var(--r-s);margin-bottom:10px}
.tuto summary{cursor:pointer;padding:13px 15px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;list-style:none}
.tuto summary::-webkit-details-marker{display:none}
.tuto .tb{padding:0 15px 15px;display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:20px}
@media (max-width:700px){.tuto .tb{grid-template-columns:minmax(0,1fr)}}
.tuto ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:7px}
.pro{margin-top:12px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--soft);font-size:13.5px;border-radius:0 6px 6px 0}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
.tw{overflow-x:auto}
.big{font-family:var(--f-display);font-weight:600;font-size:30px;font-variant-numeric:tabular-nums}

/* Moodboard */
.mb{columns:4 220px;column-gap:12px}
.mb .card{break-inside:avoid;margin-bottom:12px;width:100%}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r);padding:36px 24px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:22px;margin-bottom:6px}

/* Conseiller */
.fab{position:fixed;right:max(20px,calc(env(safe-area-inset-right,0px) + 20px));bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:26;border-radius:999px;padding:13px 20px 13px 16px;box-shadow:0 10px 30px rgba(20,30,80,.28)}
@media (max-width:860px){.fab{display:none}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);z-index:40;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s ease;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.open{transform:none;box-shadow:-20px 0 60px rgba(0,0,0,.18)}
.dhead{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.avatar{width:38px;height:38px;border-radius:50%;background:conic-gradient(from 30deg,#2747D0,#9DB1FF,#C9B08A,#3E5B4C,#2747D0);flex:none}
.dhead b{display:block;font-family:var(--f-display);font-size:17px}
.dhead small{color:var(--muted);font-size:12.5px}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.55}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--soft);border-bottom-left-radius:4px}
.msg.a p{margin:0 0 8px}.msg.a p:last-child{margin:0}
.msg.a ul,.msg.a ol{margin:4px 0 8px;padding-left:20px}
.msg.a strong{font-weight:600}
.msg img{max-width:160px;border-radius:8px;display:block;margin-bottom:6px}
.ref{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:999px;padding:0 9px;font-size:12.5px;cursor:pointer;font-weight:600;margin:1px 0}
.toolnote{align-self:flex-start;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.sugg{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}
.sugg button{font-size:12.5px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;cursor:pointer;text-align:left}
.composer{border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:44px;max-height:140px;border-radius:22px;padding:11px 14px}
.composer .att{position:relative;width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.composer .att input{position:absolute;inset:0;opacity:0;cursor:pointer}
.composer .send{width:44px;height:44px;padding:0;flex:none;border-radius:50%}
.attprev{padding:0 16px 8px;font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.attprev img{width:40px;height:40px;object-fit:cover;border-radius:6px}
.scrim{position:fixed;inset:0;background:rgba(10,12,10,.4);z-index:35;opacity:0;pointer-events:none;transition:opacity .28s}
.scrim.on{opacity:1;pointer-events:auto}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="topbar">
  <div class="wrap gut">
    <a class="logo" href="#accueil"><i aria-hidden="true"></i>Pièce Rêvée</a>
    <nav class="main" aria-label="Navigation principale">
      <a href="#projet" data-nav="projet">Mon projet</a>
      <a href="#matieres" data-nav="matieres">Matières</a>
      <a href="#accords" data-nav="accords">Accords</a>

/* ================= RENDU GÉNÉRATIF DES MATIÈRES ================= */
function rng(seed){let s=(seed>>>0)||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296}}
function hashStr(t){let h=2166136261;for(const ch of t){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16&255)+amt,g=(n>>8&255)+amt,b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));return `rgb(${r|0},${g|0},${b|0})`}
function blotches(x,R,W,H,col,n,rmin,rmax,a){for(let i=0;i<n;i++){const cx=R()*W,cy=R()*H,r=rmin+R()*(rmax-rmin);
  const g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,rgba(col,a));g.addColorStop(1,rgba(col,0));x.fillStyle=g;x.fillRect(cx-r,cy-r,2*r,2*r)}}
function grain(x,R,W,H,a){const img=x.getImageData(0,0,W,H),d=img.data;for(let i=0;i<d.length;i+=4){const v=(R()-.5)*255*a;d[i]+=v;d[i+1]+=v;d[i+2]+=v}x.putImageData(img,0,0)}

const PAINT = {
 travertine(x,R,W,H,c){x.fillStyle=c[0];x.fillRect(0,0,W,H);
  for(let y=0;y<H;y+=2){const a=.08+.08*Math.sin(y*.05+R()*2);x.fillStyle=rgba(R()<.5?c[1]:c[2],a);x.fillRect(0,y+Math.sin(y)*1,W,1.5+R()*2)}
  for(let i=0;i<70;i++){const px=R()*W,py=R()*H,w=4+R()*18,h=1+R()*3;x.fillStyle=rgba(c[2],.35+R()*.3);x.beginPath();x.ellipse(px,py,w,h,0,0,7);x.fill()}
  grain(x,R,W,H,.05)},
 marble(x,R,W,H,c){x.fillStyle=c[0];x.fillRect(0,0,W,H);blotches(x,R,W,H,c[2],22,40,130,.18);
  for(let v=0;v<7;v++){let px=R()*W,py=-10,ang=Math.PI/2+(R()-.5)*1.2;x.strokeStyle=rgba(c[1],.35+R()*.45);x.lineWidth=.6+R()*2.6;x.beginPath();x.moveTo(px,py);
   for(let s=0;s<80;s++){ang+=(R()-.5)*.45;px+=Math.cos(ang)*6;py+=Math.sin(ang)*6;x.lineTo(px,py)}x.stroke()}
  for(let v=0;v<14;v++){let px=R()*W,py=R()*H,ang=R()*7;x.strokeStyle=rgba(c[1],.15);x.lineWidth=.5;x.beginPath();x.moveTo(px,py);
   for(let s=0;s<20;s++){ang+=(R()-.5)*.8;px+=Math.cos(ang)*5;py+=Math.sin(ang)*5;x.lineTo(px,py)}x.stroke()}
  grain(x,R,W,H,.03)},
 terrazzo(x,R,W,H,c){x.fillStyle=c[0];x.fillRect(0,0,W,H);grain(x,R,W,H,.05);
  for(let i=0;i<260;i++){const col=c[1+Math.floor(R()*(c.length-1))],px=R()*W,py=R()*H,r=1.5+Math.pow(R(),3)*16;x.fillStyle=col;x.globalAlpha=.75+R()*.25;
   x.beginPath();const k=4+Math.floor(R()*4);for(let j=0;j<k;j++){const a=j/k*6.283+R()*.6,rr=r*(.6+R()*.5);x.lineTo(px+Math.cos(a)*rr,py+Math.sin(a)*rr)}x.closePath();x.fill()}x.globalAlpha=1},
 tile(x,R,W,H,c,m){const t=m.tile||{w:10,h:10,vary:.15,gloss:true};const tw=W/t.w,th=H/t.h;x.fillStyle="#d9d6cc";x.fillRect(0,0,W,H);

function card(it){
  let sub="",meta="";
  if(it.kind==="matiere"){sub=it.resume;meta=`<span>${esc(it.fam)}</span><span>${esc(it.prix)}</span>`}
  if(it.kind==="accord"){sub=it.ambiance;meta=`<span>${it.mats.map(m=>esc(BYID[m].nom)).join(" · ")}</span>`}
  if(it.kind==="meuble"){sub=`${esc(it.designer)}, ${it.annee}`;meta=`<span>${esc(it.editeur)}</span><span>${esc(it.prix)}</span>`}
  if(it.kind==="lieu"){sub=`${esc(it.auteur)} · ${it.annee}`;meta=`<span>${esc(it.lieu)}</span><span class="tag">${esc(it.theme)}</span>`}
  return `<article class="card" tabindex="0" role="button" data-open="${it.id}" aria-label="${esc(KIND[it.kind]+" : "+it.nom)}">
   <div class="vis">${visFor(it)}<button class="heart" type="button" data-fav="${it.id}" aria-pressed="${fav.has(it.id)}" aria-label="Ajouter au moodboard">${HEART}</button></div>

}

const ERR={not_granted:"L'accès à Claude a été refusé pour cette page. Rouvrez-la pour l'autoriser.",sampling_disabled:"Claude n'est pas disponible sur ce compte.",
 rate_limited:"Trop de demandes pour le moment. Réessayez dans quelques minutes.",image_rejected:"Cette image n'est pas acceptée. Essayez un JPG ou PNG de moins de 20 Mo.",
 invalid_json:"L'étude reçue était incomplète. Relancez.",refused:"Cette demande n'a pas pu être traitée. Reformulez.",session_expired:"Session expirée : reconnectez-vous à Claude.",prompt_too_large:"Texte trop long, raccourcissez-le."};
function setStatus(h,err){const s=$("#status");if(!s)return;s.hidden=!h;s.innerHTML=h||"";s.classList.toggle("err",!!err)}
async function runStudy(extra){
  if(busy)return;
  if(!sampleFn){setStatus("L'étude par IA fonctionne quand la page est ouverte dans Claude.",true);return}
  if(imagesOK&&!photoFile&&!extra){setStatus("Ajoutez d'abord une photo de votre espace.",true);return}
  busy=true;$("#go").disabled=true;ctl=new AbortController();
  const steps=["Lecture de la photo et des volumes…","Choix de la palette dans les nuanciers…","Sélection des pièces chez les éditeurs…","Rédaction des tutos…"];let si=0;
  setStatus(`<span class="spinner"></span> <span id="stTxt">${steps[0]}</span> <button class="btn small" type="button" id="stop">Arrêter</button>`);
  $("#stop").onclick=()=>ctl.abort();
  const tick=setInterval(()=>{si=Math.min(si+1,steps.length-1);const t=$("#stTxt");if(t)t.textContent=steps[si]},10000);
  try{
    const imgs=(photoFile&&imagesOK)?[photoFile,...inspFiles].slice(0,maxImages):[];
    const res=await sampleFn.json(buildPrompt(extra),{images:imgs.length?imgs:undefined,signal:ctl.signal,cache:false});
    if(!res||!res.concept||!Array.isArray(res.produits))throw{code:"invalid_json"};
    res.meta={space:brief.space,ts:Date.now(),photo:!!photoFile};study=res;store.set("pr_last",res);picks.clear();activeZone=null;ptab="plan";
    $("#board").innerHTML=boardHTML();wireBoard();setStatus("");
  }catch(e){if(e&&e.code==="cancelled")setStatus("");else setStatus(ERR[e?.code]||"La connexion a été interrompue. Relancez.",true)}
  finally{clearInterval(tick);busy=false;const g=$("#go");if(g)g.disabled=false}
}

  const [a,b]=totals();
  return `<span class="eyebrow">${esc(study.meta?.space||"Projet")} · ${study.produits.length} références · ${eur(a)} – ${eur(b)}</span>
   <h2 style="font-size:clamp(24px,3vw,34px);margin-top:6px">${esc(study.concept.titre)}</h2><p class="muted" style="margin:6px 0 0">${esc(study.concept.ambiance)}</p>
   <div class="ptabs" role="tablist">${[["plan","Plan sur photo"],["concept","Concept & palette"],["shop","Shopping"],["tutos","Tutos"],["mesure","Sur-mesure"],["budget","Budget"]].map(([k,l])=>`<button role="tab" type="button" data-pt="${k}" aria-selected="${ptab===k}">${l}</button>`).join("")}</div>
   <div class="ppane">${({plan:pPlan,concept:pConcept,shop:pShop,tutos:pTutos,mesure:pMesure,budget:pBudget})[ptab]()}</div>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;border-top:1px solid var(--line);padding-top:16px">
    <input type="text" id="refineIn" style="flex:1 1 240px" placeholder="Affiner : « plus lumineux », « budget divisé par deux »…" aria-label="Demander une modification">
    <button class="btn" type="button" id="refineBtn">Affiner</button>
    <button class="btn" type="button" data-advisor-ask="J'ai mon étude « ${esc(study.concept.titre)} ». Qu'est-ce que tu changerais ou ajouterais, et par quoi je commence ?">Avis de Camille</button>
    <button class="btn" type="button" id="copyList">Copier la liste d'achats</button></div>`;
}
function wireBoard(){
  const B=$("#board");if(!B)return;
  B.onclick=e=>{const t=e.target.closest("[data-pt]");if(t){ptab=t.dataset.pt;B.innerHTML=boardHTML();wireBoard();return}
   const z=e.target.closest("[data-z]");if(z){activeZone=activeZone==z.dataset.z?null:z.dataset.z;B.innerHTML=boardHTML();wireBoard();return}
   if(e.target.closest("[data-tint]")){tintOn=!tintOn;B.innerHTML=boardHTML();wireBoard();return}
   const s=e.target.closest("[data-sf]");if(s){shopF=s.dataset.sf;B.innerHTML=boardHTML();wireBoard()}};
  B.onchange=e=>{const c=e.target.closest("[data-pick]");if(c){const i=+c.dataset.pick;c.checked?picks.add(i):picks.delete(i)}};
  const rb=$("#refineBtn");if(rb){rb.onclick=()=>{const v=$("#refineIn").value.trim();if(v){readBrief();runStudy(v)}};
   $("#refineIn").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();rb.click()}}}
  const cl=$("#copyList");if(cl)cl.onclick=async()=>{const items=picks.size?[...picks].map(i=>study.produits[i]):study.produits;
   const txt=`${study.concept.titre}\n\nPALETTE\n${(study.palette||[]).map(p=>`- ${p.nom} ${p.reference||""} (${p.marque||"—"}) : ${p.usage}`).join("\n")}\n\nACHATS\n${items.map(p=>`- ${p.marque} — ${p.nom} : ${eur(p.prix_min)}–${eur(p.prix_max)}${brandUrl(p.marque)?" · "+brandUrl(p.marque):""}`).join("\n")}`;
   try{await navigator.clipboard.writeText(txt);cl.textContent="Liste copiée"}catch{cl.textContent="Copie impossible"}setTimeout(()=>cl.textContent="Copier la liste d'achats",2000)};
}
function pPlan(){
  const z=study.zones||[];const p0=study.palette?.[1]?.hex||study.palette?.[0]?.hex||"#888";
  const stage=(photoURL&&study.meta?.photo)?`<div class="stage"><img src="${photoURL}" alt="Votre espace"><div class="tint" style="background:${esc(p0)};mix-blend-mode:color;opacity:${tintOn?.35:0}"></div>
   ${z.map(x=>`<button class="pin" type="button" data-z="${x.id}" style="left:${Math.min(97,Math.max(3,+x.x))}%;top:${Math.min(95,Math.max(5,+x.y))}%" aria-pressed="${activeZone==x.id}" aria-label="Zone ${x.id}">${x.id}</button>`).join("")}</div>
   <div style="display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap"><button class="btn small" type="button" data-tint>${tintOn?"Photo d'origine":"Aperçu des couleurs"}</button><span class="muted" style="font-size:12.5px">Touchez un repère pour voir les références de la zone.</span></div>`
   :`<p class="notice">La photo n'est pas conservée d'une visite à l'autre. Les zones restent consultables.</p>`;
  return `${stage}<div class="zones">${z.map(x=>`<button type="button" class="zone ${activeZone==x.id?"on":""}" data-z="${x.id}"><b>${x.id}</b><strong>${esc(x.titre)}</strong><p>${esc(x.action)}</p></button>`).join("")}</div>
   ${activeZone?`<h3 style="margin:22px 0 12px;font-size:20px">Références de la zone ${esc(activeZone)}</h3><div class="prods">${study.produits.filter(p=>p.zone_id==activeZone).map(prodCard).join("")||'<p class="muted">Aucune référence liée.</p>'}</div>`:""}`;
}
function pConcept(){const c=study.concept;return `<p style="max-width:66ch">${esc(c.resume)}</p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin:18px 0">
   <div><span class="eyebrow">Ce que dit votre photo</span><ul class="dots" style="margin-top:8px">${(c.analyse||[]).map(a=>`<li>${esc(a)}</li>`).join("")}</ul></div>
   <div><span class="eyebrow">Principes appliqués</span><ul class="dots" style="margin-top:8px">${(c.principes||[]).map(a=>`<li>${esc(a)}</li>`).join("")}</ul></div></div>
  <span class="eyebrow">Palette</span><div class="swatches" style="margin-top:8px">${(study.palette||[]).map(p=>`<div class="sw"><div class="c" style="background:${esc(p.hex)}"></div><div class="t"><b>${esc(p.nom)}</b><br><span class="mono">${esc([p.marque,p.reference].filter(Boolean).join(" · "))}</span><br><span class="muted">${esc(p.usage)}</span>${p.marque?`<br><a href="${gSearch(p.marque+" "+p.nom+" "+(p.reference||""))}" target="_blank" rel="noopener">Voir la teinte ↗</a>`:""}</div></div>`).join("")}</div>`}
function prodCard(p){const i=study.produits.indexOf(p),site=brandUrl(p.marque),q=`${p.marque} ${p.nom}`;
  return `<article class="prod"><div class="top"><span class="bn">${esc(p.marque)}</span><span class="tag">${esc(p.gamme)}</span></div><h4>${esc(p.nom)}</h4>
  <div class="top"><span class="muted" style="font-size:12.5px">${esc(p.categorie)}${p.dimensions?" · "+esc(p.dimensions):""}</span><span class="price">${eur(p.prix_min)}${p.prix_max!==p.prix_min?" – "+eur(p.prix_max):""}</span></div>
  <p>${esc(p.pourquoi)}</p>${p.confiance==="moyenne"?'<span class="conf">Modèle exact à confirmer sur le site de la marque</span>':""}
  <div class="links">${site?`<a class="btn small" href="${site}" target="_blank" rel="noopener">${esc(p.marque)} ↗</a>`:""}<a class="btn small" href="${gShop(q)}" target="_blank" rel="noopener">Prix ↗</a><a class="btn small" href="${gSearch(q)}" target="_blank" rel="noopener">Fiche ↗</a></div>
  <label style="display:flex;gap:6px;font-size:12.5px;color:var(--muted)"><input type="checkbox" data-pick="${i}" ${picks.has(i)?"checked":""}> Dans ma liste d'achats</label></article>`}
function pShop(){const cats=["Tout",...new Set(study.produits.map(p=>p.categorie)),...["accessible","milieu","luxe","niche"].filter(g=>study.produits.some(p=>p.gamme===g))];
  const list=study.produits.filter(p=>shopF==="Tout"||p.categorie===shopF||p.gamme===shopF);
  return `<div class="chips" style="margin-bottom:14px">${cats.map(c=>`<button class="chip" type="button" data-sf="${esc(c)}" aria-pressed="${c===shopF}">${esc(c)}</button>`).join("")}</div><div class="prods">${list.map(prodCard).join("")}</div>`}
function pTutos(){return (study.tutos||[]).map((t,i)=>`<details class="tuto" ${i===0?"open":""}><summary><h4 style="font-size:18px">${esc(t.titre)}</h4><span class="muted" style="font-size:12.5px">${esc(t.difficulte)} · ${esc(t.duree)}</span></summary>
  <div class="tb"><div><span class="eyebrow">Outils</span><ul class="dots" style="margin-top:8px">${(t.outils||[]).map(o=>`<li>${esc(o)}</li>`).join("")}</ul><a class="btn small" style="margin-top:12px" href="${ytSearch(t.titre+" tuto")}" target="_blank" rel="noopener">Vidéos ↗</a></div>
  <div><span class="eyebrow">Étapes</span><ol style="margin-top:8px">${(t.etapes||[]).map(s=>`<li>${esc(s)}</li>`).join("")}</ol>${t.astuce?`<div class="pro"><b>Astuce d'atelier.</b> ${esc(t.astuce)}</div>`:""}</div></div></details>`).join("")||'<p class="muted">Pas de tuto.</p>'}
function pMesure(){const m=study.sur_mesure||[];if(!m.length)return '<p class="muted">Aucun sur-mesure nécessaire.</p>';
  return `<div class="prods">${m.map(x=>`<article class="prod"><span class="bn">${esc(x.artisan)}</span><h4>${esc(x.element)}</h4><span class="price">${eur(x.budget_min)} – ${eur(x.budget_max)}</span><p>${esc(x.description)}</p>
  <div class="links"><a class="btn small" href="${gSearch(x.artisan+" "+x.element+" près de chez moi")}" target="_blank" rel="noopener">Trouver un artisan ↗</a></div></article>`).join("")}</div>
  <p class="notice" style="margin-top:12px">Demandez 2 à 3 devis détaillés. Pour cuisine et dressing, des façades sur-mesure existent pour caissons IKEA (Plum Living, Reform).</p>`}
function pBudget(){const [a,b]=totals();const sel=[...picks].map(i=>study.produits[i]).filter(Boolean);const s=sel.reduce((t,p)=>[t[0]+(+p.prix_min||0),t[1]+(+p.prix_max||0)],[0,0]);
  return `<div style="display:flex;gap:32px;flex-wrap:wrap;margin-bottom:18px"><div><span class="eyebrow">Projet complet</span><div class="big">${eur(a)} – ${eur(b)}</div></div><div><span class="eyebrow">Ma liste (${sel.length})</span><div class="big">${sel.length?eur(s[0])+" – "+eur(s[1]):"—"}</div></div></div>
  <span class="eyebrow">Ordre des travaux</span><div class="tw"><table style="margin:8px 0 20px"><tbody>${(study.plan||[]).map((p,i)=>`<tr><td class="mono">${i+1}</td><td>${esc(p.etape)}</td><td>${esc(p.duree)}</td></tr>`).join("")}</tbody></table></div>
  <div class="tw"><table><thead><tr><th>Référence</th><th>Marque</th><th class="num">Min</th><th class="num">Max</th></tr></thead><tbody>
  ${study.produits.map(p=>`<tr><td>${esc(p.nom)}</td><td>${esc(p.marque)}</td><td class="num">${eur(p.prix_min)}</td><td class="num">${eur(p.prix_max)}</td></tr>`).join("")}
  ${(study.sur_mesure||[]).map(p=>`<tr><td>${esc(p.element)} (sur-mesure)</td><td>${esc(p.artisan)}</td><td class="num">${eur(p.budget_min)}</td><td class="num">${eur(p.budget_max)}</td></tr>`).join("")}</tbody></table></div>
  <p class="muted" style="font-size:12.5px">Fourchettes indicatives. Les alternatives d'une même zone ne s'additionnent pas forcément.</p>`}

/* ================= CONSEILLÈRE IA ================= */
let turns=store.get("pr_chat",[]), chatBusy=false, chatCtl=null, chatImg=null;
const SUGG=["Quelle couleur de mur avec un parquet en chêne ?","Comment agrandir visuellement une petite chambre ?","Salle de bain de locataire : que faire sans travaux ?","Quels meubles iconiques pour moins de 1 000 € ?","Aménager un balcon de 4 m² façon Méditerranée","Comment bien éclairer un salon le soir ?"];

function libraryIndex(){return ALL.map(i=>`${i.id} | ${KIND[i.kind]} | ${i.nom}${i.kind==="meuble"?` (${i.designer}, ${i.editeur}, ${i.prix})`:i.kind==="matiere"?` (${i.prix})`:i.kind==="lieu"?` (${i.lieu}, ${i.theme})`:` (${i.mats.map(m=>BYID[m].nom).join(" + ")})`}`).join("\n")}
function rules(){
  const moods=[...fav].map(id=>BYID[id]?.nom).filter(Boolean).join(", ")||"vide";
  const proj=study?`Projet en cours : « ${study.concept.titre} » (${study.meta?.space}), palette ${study.palette?.map(p=>p.nom).join(", ")}.`:"Pas encore d'étude de projet.";
  return `Tu es Camille, conseillère en architecture d'intérieur au sein de l'application « Pièce Rêvée ». Tu as l'œil d'une architecte d'intérieur haut de gamme et le sens pratique de quelqu'un qui bricole. Tu parles français, chaleureusement, simplement, sans jargon inutile.

Ta façon de conseiller :
- Réponds de façon concrète et actionnable : quoi faire, avec quelle référence réelle (marque, teinte et numéro de nuancier, modèle), à quel prix indicatif en euros, dans quel ordre.
- Propose toujours une option accessible ET une option plus haut de gamme quand c'est pertinent.
- Tiens compte des contraintes (locataire, budget, enfants, animaux, lumière) ; si une info essentielle manque, pose UNE question courte à la fin.
- Ne cite que des produits et marques qui existent. Si tu n'es pas sûre d'un modèle exact, dis-le.
- Réponses courtes : 120 à 220 mots, listes à puces si utile, gras pour les références clés. Pas de titres.
- Quand un élément de la bibliothèque de l'appli est pertinent, cite-le avec son identifiant entre doubles crochets, ex. [[m-travertin]] ou [[f-togo]] : il devient un lien cliquable. N'invente jamais d'identifiant.
- Si l'utilisateur veut une étude complète sur photo de sa pièce, invite-le à utiliser l'onglet « Mon projet ».
${toolsOK?"- Tu peux ajouter un élément au moodboard de l'utilisateur avec l'outil ajouter_moodboard quand il le demande ou l'accepte.":""}

Bibliothèque de l'appli (identifiant | type | nom) :
${libraryIndex()}

Moodboard de l'utilisateur : ${moods}
${proj}`;
}
function md(t){
  let h=esc(t).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\[\[([a-z]-[a-z0-9-]+)\]\]/g,(m,id)=>BYID[id]?`<button class="ref" type="button" data-open="${id}">${esc(BYID[id].nom)}</button>`:"");
  const lines=h.split("\n");let out="",list=null;
  for(const l of lines){const ul=l.match(/^\s*[-•*]\s+(.*)/),ol=l.match(/^\s*\d+[.)]\s+(.*)/);
    if(ul||ol){const tag=ul?"ul":"ol";if(list!==tag){if(list)out+=`</${list}>`;out+=`<${tag}>`;list=tag}out+=`<li>${(ul||ol)[1]}</li>`}
    else{if(list){out+=`</${list}>`;list=null}if(l.trim())out+=`<p>${l.replace(/^#+\s*/,"")}</p>`}}
  if(list)out+=`</${list}>`;return out;
}
function renderMsgs(){
  const M=$("#msgs");
  if(!turns.length){M.innerHTML=`<div class="msg a"><p>Bonjour, je suis <strong>Camille</strong>. Je vous aide à choisir couleurs, matières, meubles et éclairage, et à tout rendre faisable selon votre budget.</p><p>Posez-moi une question, ou joignez une photo de votre pièce pour un avis.</p></div>`;$("#sugg").hidden=false}
  else{M.innerHTML=turns.map(t=>t.role==="user"?`<div class="msg u">${t.img?`<span style="font-size:12px;opacity:.85">📷 Photo jointe</span><br>`:""}${esc(t.content)}</div>`:`<div class="msg a">${md(t.content)}</div>`).join("");$("#sugg").hidden=true}
  M.scrollTop=M.scrollHeight;
}
$("#sugg").innerHTML=SUGG.map(s=>`<button type="button">${esc(s)}</button>`).join("");
$("#sugg").onclick=e=>{const b=e.target.closest("button");if(b)sendChat(b.textContent)};

async function sendChat(text){
  text=(text||"").trim();if(!text||chatBusy)return;
  if(!sampleFn){turns.push({role:"user",content:text},{role:"assistant",content:"Je fonctionne quand cette page est ouverte dans Claude. Ouvrez-la depuis votre compte Claude pour discuter avec moi."});renderMsgs();return}
  const img=chatImg;chatImg=null;$("#attprev").hidden=true;$("#chatImg").value="";
  turns.push({role:"user",content:text,img:!!img});renderMsgs();
  const M=$("#msgs");const bubble=document.createElement("div");bubble.className="msg a";bubble.innerHTML=`<span class="spinner"></span> Camille réfléchit…`;M.append(bubble);M.scrollTop=M.scrollHeight;
  chatBusy=true;$("#sendBtn").disabled=true;chatCtl=new AbortController();
  const hist=turns.slice(-12).map(t=>({role:t.role,content:t.img&&t.role==="user"?t.content+(t===turns[turns.length-1]?" (photo jointe)":" (une photo avait été jointe)"):t.content}));
  const input=[{role:"user",content:rules()},...hist];
  const opts={signal:chatCtl.signal,onText:({text})=>{bubble.innerHTML=md(text);M.scrollTop=M.scrollHeight}};
  if(img&&imagesOK)opts.images=[img];
  if(toolsOK)opts.tools=[
    {name:"ajouter_moodboard",description:"Ajoute un élément de la bibliothèque (par son identifiant, ex. m-travertin) au moodboard de l'utilisateur. Renvoie le nom de l'élément ajouté.",
     inputSchema:{type:"object",properties:{id:{type:"string",description:"Identifiant de la bibliothèque"}},required:["id"]},
     execute(inp){const id=String(inp.id||"");if(!BYID[id])throw new Error("Identifiant inconnu");if(!fav.has(id))toggleFav(id);
       const n=document.createElement("div");n.className="toolnote";n.textContent="✓ "+BYID[id].nom+" ajouté au moodboard";M.insertBefore(n,bubble);return {ajoute:BYID[id].nom}}}];
  else opts.cache=false;
  try{const r=await sampleFn(input,opts);turns.push({role:"assistant",content:r.text})}
  catch(e){if(e.code==="cancelled"){if(e.text)turns.push({role:"assistant",content:e.text})}
    else{turns.push({role:"assistant",content:e.text?e.text+"\n\n(Réponse interrompue.)":(ERR[e.code]||"La connexion a été interrompue. Reposez votre question.")})}}
  finally{chatBusy=false;$("#sendBtn").disabled=false;store.set("pr_chat",turns.slice(-30).map(({img,...t})=>t));renderMsgs()}
}
$("#composer").onsubmit=e=>{e.preventDefault();const v=$("#chatIn").value;$("#chatIn").value="";$("#chatIn").style.height="";sendChat(v)};
$("#chatIn").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#composer").requestSubmit()}});
$("#chatIn").addEventListener("input",e=>{e.target.style.height="";e.target.style.height=Math.min(140,e.target.scrollHeight)+"px"});
$("#chatImg").onchange=e=>{const f=e.target.files[0];if(!f)return;chatImg=f;const p=$("#attprev");p.hidden=false;p.innerHTML=`<img src="${URL.createObjectURL(f)}" alt="">Photo prête à envoyer <button class="btn small ghost" type="button" id="rmAtt">Retirer</button>`;$("#rmAtt").onclick=()=>{chatImg=null;p.hidden=true;$("#chatImg").value=""}};
$("#newChat").onclick=()=>{chatCtl?.abort();turns=[];store.set("pr_chat",[]);renderMsgs()};

function openDrawer(){$("#drawer").classList.add("open");$("#drawer").setAttribute("aria-hidden","false");$("#scrim").classList.add("on");renderMsgs();setTimeout(()=>$("#chatIn").focus(),250)}
function closeDrawer(){$("#drawer").classList.remove("open");$("#drawer").setAttribute("aria-hidden","true");$("#scrim").classList.remove("on")}
$("#fab").onclick=openDrawer;$("#tabAdv").onclick=openDrawer;$("#closeDrawer").onclick=closeDrawer;$("#scrim").onclick=closeDrawer;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#drawer").classList.contains("open"))closeDrawer()});

/* ================= DÉMARRAGE ================= */
updateCount();go();
(async()=>{try{
  sampleFn=await window.claude?.use?.("sample");if(!sampleFn){$("#attWrap").hidden=true;return}
  const lim=await sampleFn.limits().catch(()=>null);
  if(lim?.images){imagesOK=true;maxImages=lim.images.maxCount}else $("#attWrap").hidden=true;
  if(lim?.tools)toolsOK=true;
}catch{}})();

</script>
