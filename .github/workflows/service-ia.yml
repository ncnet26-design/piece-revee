name: Service IA (Cloudflare Worker piece-revee-ia)

# « verifier » : contrôle la clé et l'état du service, sans rien modifier.
# « deployer » : met en ligne workers/ia/worker.js en conservant les réglages existants (clés secrètes, KV QUOTA, R2, variables).
on:
  workflow_dispatch:
    inputs:
      action: { description: "verifier ou deployer", required: true, default: verifier, type: choice, options: [verifier, deployer, modeles, test-recherche, diag-recherche] }
      requete: { description: "Requête pour test-recherche", required: false, default: "table basse ovale en travertin", type: string }

permissions:
  contents: write

env:
  CF_ACCOUNT: f8d17f2edfe8ee1b22e66bc4c0bf364b
  WORKER: piece-revee-ia

jobs:
  service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Vérifier la clé Cloudflare
        env: { CF_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
        run: |
          exec > >(tee -a rapport.txt) 2>&1
          test -n "$CF_TOKEN" || { echo "Secret CLOUDFLARE_API_TOKEN absent"; exit 1; }
          curl -sS -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | jq '{success, status: .result.status, errors}'
      - name: État du service (noms des réglages, jamais leurs valeurs)
        env: { CF_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
        run: |
          exec > >(tee -a rapport.txt) 2>&1
          echo "Workers du compte :"
          curl -sS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts" | jq -r '.success, (.errors|tostring), (.result // [] | .[].id)'
          echo "Réglages de $WORKER :"
          curl -sS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/$WORKER/settings" | jq '{success, errors, compatibility_date: .result.compatibility_date, bindings: [.result.bindings[]? | {name, type}]}'
          echo "Sous-domaine workers.dev :"
          curl -sS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" | jq '{success, subdomain: .result.subdomain}'
          echo "Réponse publique actuelle :"
          curl -sS --max-time 20 "https://$WORKER.ewanesteves26.workers.dev/" | head -c 600; echo
      - name: Mettre en ligne (réglages conservés)
        if: ${{ inputs.action == 'deployer' }}
        env: { CF_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
        run: |
          exec > >(tee -a rapport.txt) 2>&1
          COMPAT=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/$WORKER/settings" | jq -r '.result.compatibility_date // "2025-01-01"')
          # Compteur strict des plafonds (Durable Object « Compteur », stockage SQLite de l'offre gratuite) : créé une seule fois (étiquette v1).
          TAG=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts" | jq -r --arg w "$WORKER" '.result[]? | select(.id == $w) | .migration_tag // ""')
          echo "Étiquette de migration actuelle : ${TAG:-aucune}"
          if [ "$TAG" = "v1" ]; then MIG='null'; else MIG='{"new_tag":"v1","new_sqlite_classes":["Compteur"]}'; fi
          jq -n --arg c "$COMPAT" --argjson mig "$MIG" '{main_module: "worker.js", compatibility_date: $c, bindings: [{type: "ai", name: "AI"}, {type: "durable_object_namespace", name: "COMPTEUR", class_name: "Compteur"}], keep_bindings: ["kv_namespace", "r2_bucket", "secret_text", "plain_text", "secret_key"]} + (if $mig == null then {} else {migrations: $mig} end)' > metadata.json
          jq -c '{bindings, migrations}' metadata.json
          curl -sS -X PUT -H "Authorization: Bearer $CF_TOKEN" \
            -F "metadata=@metadata.json;type=application/json" \
            -F "worker.js=@workers/ia/worker.js;type=application/javascript+module" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/$WORKER" | jq '{success, errors, bindings: [.result.bindings[]? | {name, type}]}'
          sleep 8
          echo "Réponse publique après mise en ligne :"
          curl -sS --max-time 20 "https://$WORKER.ewanesteves26.workers.dev/" | head -c 600; echo
      - name: Modèles Gemini disponibles (liste gratuite, aucun appel payant)
        if: ${{ inputs.action == 'modeles' }}
        env: { GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}" }
        run: |
          exec > >(tee -a rapport.txt) 2>&1
          curl -sS -H "x-goog-api-key: $GEMINI_API_KEY" "https://generativelanguage.googleapis.com/v1beta/models?pageSize=200" | jq -r '.models[] | select(.supportedGenerationMethods | index("generateContent")) | "\(.name)\t\(.displayName)\t\(.inputTokenLimit)"'
      - name: Test réel d'une recherche de produits (une seule)
        if: ${{ inputs.action == 'test-recherche' }}
        env: { REQ: "${{ inputs.requete }}" }
        run: |
          exec > >(tee -a rapport.txt) 2>&1
          jq -n --arg q "$REQ" '{query: $q, label: $q, visiteur: "robot-test-recherche"}' > req.json
          curl -sS --max-time 90 -X POST -H "Origin: https://odd-bar-c583.ewanesteves26.workers.dev" -H "Content-Type: application/json" --data @req.json "https://$WORKER.ewanesteves26.workers.dev/v2/recherche" | jq '{erreur, requetes, etapes, suggestions: (.suggestions != null), produits: [.produits[]? | {title, merchant, price, source, url}]}'
      - name: Diagnostic de la recherche Google via Gemini (un appel)
        if: ${{ inputs.action == 'diag-recherche' }}
        env: { GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}", REQ: "${{ inputs.requete }}" }
        run: |
          exec > >(tee -a rapport.txt) 2>&1
          node -e '
            const q = process.env.REQ;
            const prompt = [
              `Use Google Search now (at most 2 searches) to find up to 8 different products currently for sale online that closely match this item seen in an interior design image: "${q}". Shopping query (French): "${q}".`,
              "Prefer online shops that deliver to France (marketplaces, furniture and decor retailers, DIY stores, design brands), with a range of prices from affordable to premium.",
              "Only list direct product pages (one product per page), never category pages, blogs or search pages. Never invent a URL: only pages you found with the search.",
              "Finish your answer with a JSON block: {\"products\":[{\"title\":\"\",\"url\":\"\",\"merchant\":\"\"}]}.",
            ].join("\n");
            for (const [name, gc] of [["low", { thinkingConfig: { thinkingLevel: "low" } }], ["sans", undefined]]) {
              require("fs").writeFileSync(`d-${name}.json`, JSON.stringify({ contents: [{ role: "user", parts: [{ text: prompt }] }], tools: [{ google_search: {} }], ...(gc ? { generationConfig: gc } : {}) }));
            }'
          for V in low sans; do
            echo "=== réglage $V"
            curl -sS --max-time 120 -H "x-goog-api-key: $GEMINI_API_KEY" -H "content-type: application/json" --data @d-$V.json "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent" > r.json
            jq '{error: .error.message, finish: .candidates[0].finishReason, text: (.candidates[0].content.parts // [] | map(.text // "") | join("") | .[-900:]), queries: .candidates[0].groundingMetadata.webSearchQueries, nchunks: (.candidates[0].groundingMetadata.groundingChunks // [] | length), usage: .usageMetadata.thoughtsTokenCount}' r.json
          done
          echo "=== redirection d'un lien"
          U=$(jq -r '.candidates[0].groundingMetadata.groundingChunks[0].web.uri // empty' r.json)
          [ -n "$U" ] && curl -sS -o /dev/null -w "%{http_code} %{redirect_url}\n" -I "$U"
      - name: Publier le rapport (branche robot/service-ia)
        if: ${{ always() }}
        run: |
          mkdir -p .robot && mv rapport.txt .robot/service-ia.txt 2>/dev/null || echo "pas de rapport" > .robot/service-ia.txt
          git config user.name "robot-service"
          git config user.email "robot@users.noreply.github.com"
          git checkout -B robot/service-ia
          git add -f .robot/service-ia.txt
          git commit -m "Rapport du service IA (${{ inputs.action }})" || exit 0
          git push -f origin robot/service-ia
