name: Ressources réalistes (textures, meubles 3D, photos)

# Se lance à la main : onglet « Actions » → « Ressources réalistes » → « Run workflow ».
on:
  workflow_dispatch:
    inputs:
      textures: { description: "Textures photographiques (Poly Haven, CC0)", type: boolean, default: true }
      modeles: { description: "Meubles et objets 3D (Poly Haven, CC0)", type: boolean, default: true }
      photos: { description: "Photos libres de la galerie (Openverse ; Unsplash/Pexels si clés)", type: boolean, default: true }
      liens: { description: "Vérifier les liens d'achat des enseignes", type: boolean, default: true }
      catalogue: { description: "Inventaire illustré des textures Poly Haven (pour choisir)", type: boolean, default: false }
      choix: { description: "Télécharger les textures choisies (content/data/texture-picks.json)", type: boolean, default: false }
      inspirations: { description: "Photos d'inspiration candidates (planches-contact à trier)", type: boolean, default: false }
      inspirations_ia: { description: "Photos d'inspiration créées par IA (gratuit via FLUX ; Gemini si le secret GEMINI_API_KEY existe)", type: boolean, default: false }
      inspirations_choix: { description: "Télécharger les photos d'inspiration choisies (content/data/inspiration-picks.json)", type: boolean, default: false }

permissions:
  contents: write

jobs:
  ressources:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Inventaire des textures
        if: ${{ inputs.catalogue }}
        continue-on-error: true
        run: node --experimental-strip-types scripts/texture-catalog.ts
      - name: Textures choisies pour le showroom
        if: ${{ inputs.choix }}
        continue-on-error: true
        run: node --experimental-strip-types scripts/fetch-assets.ts --picks
      - name: Photos d'inspiration candidates
        if: ${{ inputs.inspirations }}
        continue-on-error: true
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          mkdir -p .robot
          node --experimental-strip-types scripts/inspirations.ts --candidats 2>&1 | tee -a .robot/inspirations.log
      - name: Photos d'inspiration créées par IA
        if: ${{ inputs.inspirations_ia }}
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_IMAGES: "40"
        run: |
          mkdir -p .robot
          node --experimental-strip-types scripts/ai-inspirations.ts 2>&1 | tee -a .robot/inspirations-ia.log
      - name: Photos d'inspiration choisies
        if: ${{ inputs.inspirations_choix }}
        continue-on-error: true
        run: |
          mkdir -p .robot
          git fetch origin robot/ressources && git checkout origin/robot/ressources -- .robot/inspirations/candidats.json || true
          node --experimental-strip-types scripts/inspirations.ts --choix 2>&1 | tee -a .robot/inspirations.log
      - name: Textures photographiques
        if: ${{ inputs.textures }}
        continue-on-error: true
        run: node --experimental-strip-types scripts/fetch-assets.ts --textures
      - name: Meubles et objets 3D
        if: ${{ inputs.modeles }}
        continue-on-error: true
        env: { NODE_OPTIONS: "--max-old-space-size=6144" }
        run: |
          mkdir -p .robot
          node --experimental-strip-types scripts/fetch-assets.ts --models 2>&1 | tee .robot/modeles.log
          node --experimental-strip-types scripts/model-dims.ts 2>&1 | tail -5 | tee -a .robot/modeles.log
      - name: Photos libres
        if: ${{ inputs.photos }}
        continue-on-error: true
        timeout-minutes: 40
        run: pnpm images:import
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      - name: Liens d'achat des enseignes
        if: ${{ inputs.liens }}
        continue-on-error: true
        run: node --experimental-strip-types scripts/check-retailers.ts
      - name: Déposer les ressources dans la branche robot/ressources (relecture avant intégration)
        if: ${{ always() }}
        run: |
          git config user.name "piece-revee-robot"
          git config user.email "robot@users.noreply.github.com"
          git checkout -B robot/ressources
          git add public/textures public/models public/inspirations content/data || true
          git add -f .robot || true
          git commit -m "ressources: textures, meubles 3D et photos libres ($(date +%Y-%m-%d))" || { echo "Rien de nouveau"; exit 0; }
          git push -f origin robot/ressources
