name: Matières 4K (Poly Haven, ambientCG)

# Lancé à la main (ou par Claude) : « inventaire » produit des planches de candidates à regarder,
# « telecharger » récupère les textures choisies (content/data/matieres-choix.json) en 4K avec leurs versions web.
on:
  workflow_dispatch:
    inputs:
      action: { description: "inventaire ou telecharger", type: choice, options: [inventaire, telecharger], default: inventaire }

permissions:
  contents: write

jobs:
  matieres:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Robot matières
        run: |
          git fetch origin robot/matieres 2>/dev/null && git checkout origin/robot/matieres -- public/matieres content/data/matieres-4k.json 2>/dev/null || true
          mkdir -p .robot/matieres
          node --experimental-strip-types scripts/matieres-4k.ts --${{ inputs.action }} 2>&1 | tee .robot/matieres/journal.txt
      - name: Déposer le résultat dans la branche robot/matieres (relecture avant intégration)
        if: ${{ always() }}
        run: |
          git config user.name "piece-revee-robot"
          git config user.email "robot@users.noreply.github.com"
          git checkout -B robot/matieres
          rm -rf .robot/tmp
          git add -f .robot/matieres
          git commit -m "matières : ${{ inputs.action }} — journal ($(date +%Y-%m-%d))" || true
          git push -f origin robot/matieres
          # Une matière par envoi (un seul gros envoi a été refusé par GitHub), avec nouvelles tentatives.
          for d in public/matieres/*/; do
            [ -d "$d" ] || continue
            git add "$d" content/data/matieres-4k.json
            git commit -m "matières : $(basename $d)" || continue
            for n in 1 2 3 4; do git push origin robot/matieres && break; sleep $((n*5)); done
          done
