name: Vérification du catalogue achetable

# Ouvre chaque page produit de data/catalogue.json (prix, disponibilité, lien) et dépose le résultat
# dans la branche robot/verification pour relecture avant intégration. Chaque semaine et à la main.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: write

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node --experimental-strip-types scripts/verifier-catalogue.ts
      - name: Déposer dans robot/verification
        if: ${{ always() }}
        run: |
          git config user.name "piece-revee-robot"
          git config user.email "robot@users.noreply.github.com"
          git checkout -B robot/verification
          git add data/catalogue.json && git add -f .robot/verification.txt
          git commit -m "catalogue : vérification des pages produits ($(date +%Y-%m-%d))" || { echo "Rien de nouveau"; exit 0; }
          for n in 1 2 3 4 5; do git push -f origin robot/verification && break; sleep $((n*10)); done
