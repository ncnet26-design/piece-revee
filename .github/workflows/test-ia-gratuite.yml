name: Test IA gratuite (Cloudflare Workers AI)

# Essai de l'IA gratuite de Cloudflare (10 000 unités par jour offertes) : transformation de pièce, repérage des meubles, comparaison de textes.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CF_ACCOUNT: f8d17f2edfe8ee1b22e66bc4c0bf364b

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Essais
        env: { CF_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
        run: |
          mkdir -p .robot/ia-gratuite && cd .robot/ia-gratuite
          exec > >(tee -a rapport.txt) 2>&1
          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/ai/run"
          IMG=../../scripts/test-ia-gratuite-avant.jpg
          P="Redesign this exact room in a warm japandi style. Keep the same walls, mouldings, windows, door, herringbone parquet, camera angle and perspective. Replace the furniture: low light oak sofa with linen cushions, round oak coffee table, washi paper pendant lamp, wool rug, ceramic vases, a linen curtain. Realistic interior design magazine photograph, natural daylight."
          for M in flux-2-klein-4b flux-2-klein-9b; do
            echo "== $M"; T=$(date +%s.%N)
            curl -sS --max-time 120 -X POST "$API/@cf/black-forest-labs/$M" -H "Authorization: Bearer $CF_TOKEN" \
              --form "prompt=$P" --form "input_image_0=@$IMG" --form width=1024 --form height=688 -o $M.json -w "HTTP %{http_code}\n"
            echo "durée $(echo "$(date +%s.%N) - $T" | bc) s"
            jq -r '.result.image // empty' $M.json | base64 -d > $M.jpg 2>/dev/null || true
            jq -c '{success, errors, messages}' $M.json; ls -la $M.jpg 2>/dev/null; rm -f $M.json
          done
          echo "== accord licence Llama vision"
          curl -sS --max-time 60 -X POST "$API/@cf/meta/llama-3.2-11b-vision-instruct" -H "Authorization: Bearer $CF_TOKEN" -d '{"prompt":"agree"}' | jq -c '{success, errors}'
          echo "== repérage des meubles (Llama 3.2 Vision)"
          B64=$(base64 -w0 ../../public/editorial/ia/salon-apres-1024.webp)
          jq -n --arg img "data:image/webp;base64,$B64" '{messages:[{role:"user",content:[{type:"text",text:"List every piece of furniture, lighting, rug and decor item visible in this interior photo, plus the floor, walls and ceiling. For each give a short French shopping label, its material and colour, and its approximate centre position as x and y percentages of the image width and height. Answer only with JSON: {\"items\":[{\"label\":\"\",\"material\":\"\",\"color\":\"\",\"x\":0,\"y\":0}]}"},{type:"image_url",image_url:{url:$img}}]}],max_tokens:900}' > req.json
          T=$(date +%s.%N)
          curl -sS --max-time 120 -X POST "$API/@cf/meta/llama-3.2-11b-vision-instruct" -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" --data @req.json | jq -r '.success, (.errors|tostring), (.result.response // .result | tostring)' | head -c 3000
          echo; echo "durée $(echo "$(date +%s.%N) - $T" | bc) s"; rm -f req.json
          echo "== comparaison de textes (bge-m3)"
          T=$(date +%s.%N)
          curl -sS --max-time 60 -X POST "$API/@cf/baai/bge-m3" -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            -d '{"text":["vase en céramique mouchetée col étroit beige","Vase en grès moucheté beige, col fin","Canapé 3 places en velours vert"]}' \
            | jq -c '{success, errors, dims: (.result.data[0]|length)}'
          echo "durée $(echo "$(date +%s.%N) - $T" | bc) s"
      - name: Publier les résultats (branche robot/ia-gratuite)
        if: ${{ always() }}
        run: |
          git config user.name "piece-revee-robot"; git config user.email "robot@users.noreply.github.com"
          git checkout -B robot/ia-gratuite; git add -f .robot/ia-gratuite
          git commit -m "test IA gratuite $(date +%F)" || exit 0
          for n in 1 2 3; do git push -f origin robot/ia-gratuite && break; sleep 10; done
